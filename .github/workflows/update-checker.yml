name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

on:
  workflow_dispatch:
  # Enable later if automatic builds are desired:
  # schedule:
  #   - cron: "17 3 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get upstream commit
        id: upstream
        run: |
          commit="$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore source revision cache
        id: revision-cache
        uses: actions/cache@v4
        with:
          path: .upstream-revision
          key: lede-${{ steps.upstream.outputs.commit }}

      - name: Save source revision
        if: steps.revision-cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.upstream.outputs.commit }}" > .upstream-revision

      - name: Trigger firmware build
        if: steps.revision-cache.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          event-type: Source Code Update
