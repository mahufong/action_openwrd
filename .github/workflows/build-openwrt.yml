name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "LEDE branch, tag or commit to build"
        required: false
        default: "master"
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"

concurrency:
  group: openwrt-build-${{ github.ref }}-${{ github.event.inputs.source_ref || 'master' }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  SOURCE_REF: ${{ github.event.inputs.source_ref || 'master' }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout build profile
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt-get update
          sudo -E apt-get -y install             ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential             bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib             g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386             libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev             libncurses5-dev libncursesw5-dev libnsl-dev libpython3-dev libreadline-dev libssl-dev             libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3             python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion             swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev
          sudo -E apt-get clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone LEDE
        run: |
          git clone --filter=blob:none "$REPO_URL" openwrt
          cd openwrt
          git fetch --depth 1 origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          echo "LEDE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "LEDE_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-lede-dl-${{ hashFiles('.config', 'diy-part1.sh', 'diy-part2.sh') }}-${{ env.SOURCE_REF }}
          restore-keys: |
            ${{ runner.os }}-lede-dl-${{ hashFiles('.config', 'diy-part1.sh', 'diy-part2.sh') }}-
            ${{ runner.os }}-lede-dl-

      - name: Load custom feeds
        run: |
          [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && cp -a files openwrt/files
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig

      - name: Validate build profile
        run: |
          cd openwrt
          grep -q '^CONFIG_TARGET_x86_64=y' .config
          grep -q '^CONFIG_GRUB_EFI_IMAGES=y' .config
          grep -q '^CONFIG_TARGET_IMAGES_GZIP=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-zerotier=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-ttyd=y' .config
          grep -q 'packet_steering=2' package/lean/autocore/files/x86/autocore
          grep '^CONFIG_PACKAGE_.*=y' .config | sort > selected-packages.txt
          ./scripts/diffconfig.sh > diffconfig.txt

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -print -delete

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

      - name: Generate build metadata
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          {
            echo "LEDE source: $REPO_URL"
            echo "Requested ref: $SOURCE_REF"
            echo "LEDE commit: $LEDE_COMMIT"
            echo "Build date: $(date -Iseconds)"
            echo
            echo "Kernel:"
            grep -E '^LINUX_VERSION-(6\.18|6\.12)' include/kernel-6.18 include/kernel-6.12 2>/dev/null || true
          } > BUILD_INFO.txt

      - name: Collect firmware
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/openwrt/bin/targets/x86/64"
          OUT="$GITHUB_WORKSPACE/firmware_release"
          mkdir -p "$OUT"

          shopt -s nullglob
          images=("$SRC"/*x86-64-generic-squashfs-combined-efi.img.gz)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one compressed x86_64 EFI squashfs image, found ${#images[@]}"
            ls -lah "$SRC" || true
            exit 1
          fi

          cp "${images[0]}" "$OUT/"
          cp openwrt/selected-packages.txt openwrt/diffconfig.txt openwrt/BUILD_INFO.txt "$OUT/"
          cd "$OUT"
          sha256sum *.img.gz > sha256sums.txt
          echo "FIRMWARE=$OUT" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Check space usage
        if: always()
        run: df -hT

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_x86_64_UEFI${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 14
